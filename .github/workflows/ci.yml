name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and core libraries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow numpy scipy
      - name: Compile scripts and examples
        run: python -m compileall -q scripts examples
      - name: Check bundled assets
        run: |
          test -s fonts/Pangolin-Regular.ttf
          test -s fonts/PatrickHand-Regular.ttf
          test -s fonts/Itim-Regular.ttf
          test -s models/hand_landmarker.task
      - name: Render smoke test (16:9 and 9:16)
        run: |
          mkdir work && cd work
          cp ../scripts/*.py . && cp -r ../fonts ../models .
          ffmpeg -loglevel error -f lavfi -i "testsrc2=s=1280x720:r=30:d=4" -f lavfi -i "sine=f=440:d=4" -c:v libx264 -pix_fmt yuv420p -c:a aac input.mp4
          python template.py input.mp4 out_16x9.mp4 3
          PAPER_ASPECT=9:16 python template.py input.mp4 out_9x16.mp4 3
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 out_16x9.mp4)" = "1920,1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 out_9x16.mp4)" = "1080,1920"
